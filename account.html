<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - TalkWorld</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #111;
    }

    .container {
        max-width: 600px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    .info {
        margin-bottom: 20px;
    }

    .label {
        font-size: 13px;
        color: #777;
        margin-bottom: 5px;
    }

    .value {
        font-size: 18px;
        font-weight: 500;
    }

    .button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 15px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: #111;
        color: white;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        font-size: 16px;
    }

    .button.secondary {
        background: #eee;
        color: #111;
    }

    #message {
        margin-top: 20px;
        color: red;
    }
</style>
</head>
<body>
<div class="container">
<h1>Welcome to TalkWorld</h1>

<p class="subtitle">
    Your profile
</p>

<div class="info">
    <div class="label">Username</div>
    <div class="value" id="username">Loading...</div>
</div>

<div class="info">
    <div class="label">Email</div>
    <div class="value" id="email">Loading...</div>
</div>

<div class="info">
    <div class="label">Country</div>
    <div class="value" id="country">Loading...</div>
</div>

<div class="info">
    <div class="label">Language</div>
    <div class="value" id="language">Loading...</div>
</div>

<div class="info">
    <div class="label">Interest</div>
    <div class="value" id="interest">Loading...</div>
</div>

<a href="profile.html" class="button">
    Edit my profile
</a>

<a href="talk.html" class="button">
    Find someone to talk to
</a>

<button id="logout-button" class="button secondary">
    Log out
</button>

<div id="message"></div>
</div>
<script>

const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


async function loadUser() {

    try {

        const {
            data: {
                user
            },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError) {
            throw userError;
        }

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        // EMAIL
        document.querySelector("#email").textContent =
            user.email || "Not set";


        // PROFILE
        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select("username, country, language, interest")
            .eq("id", user.id)
            .maybeSingle();

        if (profileError) {
            throw profileError;
        }


        if (!profile) {

            document.querySelector("#username").textContent =
                "Not set";

            document.querySelector("#country").textContent =
                "Not set";

            document.querySelector("#language").textContent =
                "Not set";

            document.querySelector("#interest").textContent =
                "Not set";

            return;
        }


        // USERNAME
        document.querySelector("#username").textContent =
            profile.username || "Not set";


        // COUNTRY
        document.querySelector("#country").textContent =
            profile.country || "Not set";


        // LANGUAGE
        document.querySelector("#language").textContent =
            profile.language || "Not set";


        // INTEREST
        document.querySelector("#interest").textContent =
            profile.interest || "Not set";

    }

    catch (error) {

        console.error(error);

        document.querySelector("#message").textContent =
            error.message;

    }
}


document
    .querySelector("#logout-button")
    .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

    });


loadUser();

</script>
</body>
</html>
