<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>My Account - TalkWorld</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

.account-container {
max-width: 700px;
margin: 70px auto;
padding: 30px 25px;
}

.account-card {
border: 1px solid #e5e5e5;
border-radius: 18px;
padding: 30px;
margin-top: 30px;
}

.profile-item {
padding: 15px 0;
border-bottom: 1px solid #eee;
}

.profile-item:last-child {
border-bottom: none;
}

.profile-label {
font-size: 13px;
color: #777;
margin-bottom: 5px;
}

.profile-value {
font-size: 18px;
font-weight: 600;
}

.account-buttons {
display: flex;
flex-direction: column;
gap: 15px;
margin-top: 30px;
}

.profile-link {
display: block;
width: 100%;
box-sizing: border-box;
text-align: center;
text-decoration: none;
}

.logout-button {
padding: 14px 22px;
border: 1px solid #ddd;
background: white;
border-radius: 10px;
cursor: pointer;
font-size: 16px;
}

.message {
margin-top: 20px;
font-weight: 500;
}

</style>

</head>


<body>


<header class="navbar">

<div class="logo">
TalkWorld
</div>

<nav>

<a href="index.html">
Home
</a>

</nav>

</header>


<main>


<section class="account-container">


<p class="small-title">
MY ACCOUNT
</p>


<h1>
Welcome to TalkWorld
</h1>


<p>
Your profile
</p>


<div class="account-card">


<div class="profile-item">

<div class="profile-label">
Username
</div>

<div
class="profile-value"
id="username"
>
Loading...
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Email
</div>

<div
class="profile-value"
id="email"
>
Loading...
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Country
</div>

<div
class="profile-value"
id="country"
>
Not set
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Language
</div>

<div
class="profile-value"
id="language"
>
Not set
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Interest
</div>

<div
class="profile-value"
id="interest"
>
Not set
</div>

</div>


</div>


<div class="account-buttons">


<a
href="profile.html"
class="primary-button profile-link"
>
Complete my profile
</a>


<a
href="talk.html"
class="primary-button profile-link"
>
Find someone to talk to
</a>


<button
class="logout-button"
id="logout-button"
type="button"
>
Log out
</button>


</div>


<div
id="message"
class="message"
></div>


</section>


</main>


<footer>

<p>
© 2026 TalkWorld
</p>

</footer>



<script>


/* ============================= */
/* SUPABASE CONFIGURATION */
/* ============================= */


const SUPABASE_URL =
"https://arltyssfvxusgbczehwd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


/* ============================= */
/* CREATE CLIENT */
/* ============================= */


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* ============================= */
/* LOAD USER */
/* ============================= */


async function loadUser() {

try {

const result =
await supabaseClient.auth.getUser();


const user =
result.data.user;


if (!user) {

window.location.href =
"login.html";

return;

}


/* EMAIL */

document.querySelector("#email").textContent =
user.email || "Not set";


/* USERNAME */

const username =
user.user_metadata?.username;


if (username) {

document.querySelector("#username").textContent =
username;

} else {

document.querySelector("#username").textContent =
"Not set";

}


/* PROFILE */

const profileResult =
await supabaseClient
.from("profiles")
.select("country, language, interest")
.eq("id", user.id)
.maybeSingle();


if (profileResult.data) {

document.querySelector("#country").textContent =
profileResult.data.country || "Not set";


document.querySelector("#language").textContent =
profileResult.data.language || "Not set";


document.querySelector("#interest").textContent =
profileResult.data.interest || "Not set";

}


} catch (error) {

console.error(error);


document.querySelector("#username").textContent =
"Error";


document.querySelector("#email").textContent =
"Error";


document.querySelector("#message").textContent =
error.message;


document.querySelector("#message").style.color =
"red";

}

}


/* ============================= */
/* LOG OUT */
/* ============================= */


document
.querySelector("#logout-button")
.addEventListener(
"click",
async function() {


await supabaseClient
.auth
.signOut();


window.location.href =
"index.html";

}
);


/* ============================= */
/* START */
/* ============================= */


loadUser();
  alert("ACCOUNT JAVASCRIPT IS WORKING");


</script>


</body>

</html>
