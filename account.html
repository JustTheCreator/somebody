<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>My Account - TalkWorld</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

.account-container {
max-width: 700px;
margin: 70px auto;
padding: 30px 25px;
}

.account-card {
border: 1px solid #e5e5e5;
border-radius: 18px;
padding: 30px;
margin-top: 30px;
}

.profile-item {
padding: 15px 0;
border-bottom: 1px solid #eee;
}

.profile-item:last-child {
border-bottom: none;
}

.profile-label {
font-size: 13px;
color: #777;
margin-bottom: 5px;
}

.profile-value {
font-size: 18px;
font-weight: 600;
}

.account-buttons {
display: flex;
flex-direction: column;
gap: 15px;
margin-top: 30px;
}

.logout-button {
padding: 14px 22px;
border: 1px solid #ddd;
background: white;
border-radius: 10px;
cursor: pointer;
font-size: 16px;
}

.message {
margin-top: 20px;
font-weight: 500;
}

</style>

</head>


<body>


<header class="navbar">

<div class="logo">
TalkWorld
</div>

<nav>

<a href="index.html">
Home
</a>

</nav>

</header>


<main>


<section class="account-container">


<p class="small-title">
MY ACCOUNT
</p>


<h1>
Welcome to TalkWorld
</h1>


<p>
Your profile
</p>


<div class="account-card">


<div class="profile-item">

<div class="profile-label">
Username
</div>

<div
class="profile-value"
id="username"
>
Loading...
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Email
</div>

<div
class="profile-value"
id="email"
>
Loading...
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Country
</div>

<div
class="profile-value"
id="country"
>
Not set
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Language
</div>

<div
class="profile-value"
id="language"
>
Not set
</div>

</div>


<div class="profile-item">

<div class="profile-label">
Interest
</div>

<div
class="profile-value"
id="interest"
>
Not set
</div>

</div>


</div>


<div class="account-buttons">


<button
class="primary-button"
id="profile-button"
type="button"
>
Complete my profile
</button>


<button
class="primary-button"
id="find-button"
type="button"
>
Find someone to talk to
</button>


<button
class="logout-button"
id="logout-button"
type="button"
>
Log out
</button>


</div>


<div
id="message"
class="message"
></div>


</section>


</main>


<footer>

<p>
© 2026 TalkWorld
</p>

</footer>



<script>


/* ============================= */
/* SUPABASE CONFIGURATION */
/* ============================= */


const SUPABASE_URL =
"PEGA_AQUI_TU_URL";


const SUPABASE_PUBLISHABLE_KEY =
"PEGA_AQUI_TU_PUBLISHABLE_KEY";



/* ============================= */
/* SUPABASE CLIENT */
/* ============================= */


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* ============================= */
/* ELEMENTS */
/* ============================= */


const usernameElement =
document.querySelector("#username");


const emailElement =
document.querySelector("#email");


const countryElement =
document.querySelector("#country");


const languageElement =
document.querySelector("#language");


const interestElement =
document.querySelector("#interest");


const profileButton =
document.querySelector("#profile-button");


const findButton =
document.querySelector("#find-button");


const logoutButton =
document.querySelector("#logout-button");


const message =
document.querySelector("#message");



/* ============================= */
/* LOAD ACCOUNT */
/* ============================= */


async function loadAccount() {

try {

const {
data: {
user
},
error
} =
await supabaseClient
.auth
.getUser();


if (error || !user) {

window.location.href =
"login.html";

return;

}


/* EMAIL */

emailElement.textContent =
user.email || "Not set";


/* PROFILE */

const {
data: profile,
error: profileError
} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id", user.id)
.single();


if (profileError) {

console.error(profileError);

usernameElement.textContent =
user.user_metadata?.username ||
"Not set";

return;

}


/* USERNAME */

usernameElement.textContent =
profile.username || "Not set";


/* COUNTRY */

countryElement.textContent =
profile.country || "Not set";


/* LANGUAGE */

languageElement.textContent =
profile.language || "Not set";


/* INTEREST */

interestElement.textContent =
profile.interest || "Not set";


}

catch (error) {

console.error(error);

message.textContent =
"There was a problem loading your account.";

message.style.color =
"red";

}

}



/* ============================= */
/* COMPLETE PROFILE */
/* ============================= */


profileButton.addEventListener(
"click",
function() {

window.location.href =
"profile.html";

}
);



/* ============================= */
/* FIND SOMEONE */
/* ============================= */


findButton.addEventListener(
"click",
function() {

window.location.href =
"talk.html";

}
);



/* ============================= */
/* LOG OUT */
/* ============================= */


logoutButton.addEventListener(
"click",
async function() {


logoutButton.disabled =
true;


logoutButton.textContent =
"Logging out...";


const {
error
} =
await supabaseClient
.auth
.signOut();


if (error) {

console.error(error);

message.textContent =
"Could not log out.";

message.style.color =
"red";

logoutButton.disabled =
false;

logoutButton.textContent =
"Log out";

return;

}


window.location.href =
"index.html";

}
);



/* ============================= */
/* START */
/* ============================= */


loadAccount();


</script>


</body>

</html>
