<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log in - TalkWorld</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>

        .login-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px 25px;
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 10px;
        }

        .login-container p {
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .message {
            margin-top: 20px;
            font-weight: 500;
        }

        .signup-link {
            margin-top: 25px;
        }

        .signup-link a {
            color: #111;
            font-weight: 600;
        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        TalkWorld
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>


<main>


<section class="login-container">


    <p class="small-title">
        WELCOME BACK
    </p>


    <h1>
        Log in
    </h1>


    <p>
        Log in to your TalkWorld account and start talking with people around the world.
    </p>


    <form
        class="login-form"
        id="login-form"
    >


        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button
            type="submit"
            class="primary-button"
            id="login-button"
        >
            Log in
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">
            Create one
        </a>

    </div>


</section>


</main>


<footer>

    <p>
        © 2026 TalkWorld
    </p>

</footer>



<script>


/* ============================= */
/* SUPABASE CONFIGURATION        */
/* ============================= */


const SUPABASE_URL =
    "https://arltyssfvxusgbczehwd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";



/* ============================= */
/* CREATE SUPABASE CLIENT        */
/* ============================= */


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* ============================= */
/* ELEMENTS                      */
/* ============================= */


const form =
    document.querySelector("#login-form");


const button =
    document.querySelector("#login-button");


const message =
    document.querySelector("#message");



/* ============================= */
/* LOGIN                         */
/* ============================= */


form.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "Logging in...";


        message.textContent = "";



        try {


            const email =
                document
                    .querySelector("#email")
                    .value
                    .trim();


            const password =
                document
                    .querySelector("#password")
                    .value;



            /* LOGIN */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });



            /* CHECK ERROR */

            if (error) {

                throw error;

            }



            /* CHECK USER */

            if (!data.user) {

                throw new Error(
                    "Login failed."
                );

            }



            /* SUCCESS */

            message.textContent =
                "Login successful!";


            message.style.color =
                "green";


            button.textContent =
                "Logged in";



            /* GO TO ACCOUNT */

            setTimeout(
                function() {

                    window.location.href =
                        "account.html";

                },
                1000
            );


        }


        catch (error) {


            console.error(error);


            message.textContent =
                "ERROR: " +
                error.message;


            message.style.color =
                "red";


            button.disabled =
                false;


            button.textContent =
                "Log in";


        }


    }
);


</script>


</body>

</html>
