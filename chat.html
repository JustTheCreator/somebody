<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TalkWorld</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 18px;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .mine {
      align-self: flex-end;
      background: #111;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .theirs {
      align-self: flex-start;
      background: white;
      color: #111;
      border-bottom-left-radius: 5px;
    }

    #input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 16px;
      outline: none;
    }

    #sendButton {
      border: none;
      background: #111;
      color: white;
      border-radius: 22px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      text-align: center;
      padding: 8px;
      color: #777;
      font-size: 13px;
      background: white;
    }
  </style>
</head>

<body>

<header>
  TalkWorld
</header>

<div id="status">
  Conectando...
</div>

<div id="messages"></div>

<div id="input-area">

  <input
    id="messageInput"
    type="text"
    placeholder="Escribe un mensaje..."
    autocomplete="off"
  >

  <button id="sendButton">
    Enviar
  </button>

</div>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =========================================
     ELEMENTOS
  ========================================= */

  const messagesContainer =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const status =
    document.getElementById("status");


  /* =========================================
     VARIABLES
  ========================================= */

  let currentUser = null;

  let otherUserId = null;


  /* =========================================
     OBTENER USUARIO
  ========================================= */

  async function getCurrentUser() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (error || !data.user) {

      window.location.href = "login.html";

      return null;
    }

    return data.user;
  }


  /* =========================================
     ENCONTRAR AUTOMÁTICAMENTE AL OTRO USUARIO
  ========================================= */

  async function findOtherUser() {

    /*
      Buscamos mensajes enviados por el usuario actual.
    */

    const {
      data: sentMessages,
      error: sentError
    } = await supabaseClient

      .from("messages")

      .select("sender, receiver")

      .eq("sender", currentUser.id)

      .limit(1);


    if (
      !sentError &&
      sentMessages &&
      sentMessages.length > 0
    ) {

      otherUserId =
        sentMessages[0].receiver;

      return;

    }


    /*
      Si todavía no ha enviado mensajes,
      buscamos mensajes que haya recibido.
    */

    const {
      data: receivedMessages,
      error: receivedError
    } = await supabaseClient

      .from("messages")

      .select("sender, receiver")

      .eq("receiver", currentUser.id)

      .limit(1);


    if (
      !receivedError &&
      receivedMessages &&
      receivedMessages.length > 0
    ) {

      otherUserId =
        receivedMessages[0].sender;

      return;

    }


    otherUserId = null;

  }


  /* =========================================
     CARGAR MENSAJES
  ========================================= */

  async function loadMessages() {

    if (!otherUserId) {

      status.textContent =
        "No se ha encontrado una conversación.";

      return;

    }


    const {
      data,
      error
    } = await supabaseClient

      .from("messages")

      .select("*")

      .or(
        `and(sender.eq.${currentUser.id},receiver.eq.${otherUserId}),and(sender.eq.${otherUserId},receiver.eq.${currentUser.id})`
      )

      .order("created_at", {
        ascending: true
      });


    if (error) {

      console.error(
        "Error cargando mensajes:",
        error
      );

      status.textContent =
        "Error cargando la conversación.";

      return;

    }


    messagesContainer.innerHTML = "";


    data.forEach(message => {

      showMessage(message);

    });


    scrollBottom();


    status.textContent =
      "En línea";

  }


  /* =========================================
     MOSTRAR MENSAJE
  ========================================= */

  function showMessage(message) {

    if (
      document.querySelector(
        `[data-id="${message.id}"]`
      )
    ) {

      return;

    }


    const element =
      document.createElement("div");


    element.classList.add("message");


    /*
      AQUÍ distinguimos al remitente.
    */

    if (
      message.sender === currentUser.id
    ) {

      element.classList.add("mine");

    } else {

      element.classList.add("theirs");

    }


    element.dataset.id =
      message.id;


    element.textContent =
      message.content;


    messagesContainer.appendChild(
      element
    );


    scrollBottom();

  }


  /* =========================================
     REALTIME
  ========================================= */

  function startRealtime() {

    supabaseClient

      .channel("talkworld-chat")

      .on(

        "postgres_changes",

        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },

        payload => {

          const message =
            payload.new;


          /*
            Solo mostramos mensajes de
            nuestra conversación.
          */

          const belongsToConversation =

            (
              message.sender === currentUser.id &&
              message.receiver === otherUserId
            )

            ||

            (
              message.sender === otherUserId &&
              message.receiver === currentUser.id
            );


          if (
            belongsToConversation
          ) {

            showMessage(message);

          }

        }

      )

      .subscribe(

        channelStatus => {

          console.log(
            "Realtime:",
            channelStatus
          );

        }

      );

  }


  /* =========================================
     ENVIAR MENSAJE
  ========================================= */

  async function sendMessage() {

    const content =
      messageInput.value.trim();


    if (!content) {
      return;
    }


    if (!otherUserId) {

      await findOtherUser();


      if (!otherUserId) {

        alert(
          "Todavía no se ha encontrado la otra cuenta."
        );

        return;

      }

    }


    sendButton.disabled = true;


    const {
      error
    } = await supabaseClient

      .from("messages")

      .insert({

        sender: currentUser.id,

        receiver: otherUserId,

        content: content

      });


    if (error) {

      console.error(
        "Error enviando:",
        error
      );

      alert(
        "No se pudo enviar el mensaje."
      );

      sendButton.disabled = false;

      return;

    }


    messageInput.value = "";

    messageInput.focus();

    sendButton.disabled = false;

  }


  /* =========================================
     EVENTOS
  ========================================= */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================================
     SCROLL
  ========================================= */

  function scrollBottom() {

    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;

  }


  /* =========================================
     INICIAR
  ========================================= */

  async function init() {

    currentUser =
      await getCurrentUser();


    if (!currentUser) {
      return;
    }


    await findOtherUser();

    await loadMessages();

    startRealtime();

  }


  init();

</script>

</body>
</html>
