<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkWorld Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #111;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      align-self: flex-start;
      background: white;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      background: #111;
      color: white;
      padding: 0 20px;
      border-radius: 20px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  TalkWorld
</header>

<div id="messages"></div>

<div id="input-area">
  <input
    id="messageInput"
    type="text"
    placeholder="Escribe un mensaje..."
    autocomplete="off"
  >

  <button id="sendButton">
    Enviar
  </button>
</div>

<script>
  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  // ==============================
  // VARIABLES
  // ==============================

  const messagesContainer = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");

  let currentUser = null;

  // ==============================
  // INICIAR
  // ==============================

  async function init() {

    const {
      data: {
        user
      }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = user;

    await loadMessages();

    subscribeToMessages();
  }

  // ==============================
  // CARGAR MENSAJES
  // ==============================

  async function loadMessages() {

    const {
      data,
      error
    } = await supabaseClient
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: true
      });

    if (error) {
      console.error("Error cargando mensajes:", error);
      return;
    }

    messagesContainer.innerHTML = "";

    data.forEach(message => {
      addMessageToScreen(message);
    });

    scrollToBottom();
  }

  // ==============================
  // MOSTRAR MENSAJE
  // ==============================

  function addMessageToScreen(message) {

    // Evitar duplicados
    if (
      document.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {
      return;
    }

    const div = document.createElement("div");

    div.classList.add("message");

    if (message.sender_id === currentUser.id) {
      div.classList.add("mine");
    } else {
      div.classList.add("theirs");
    }

    div.dataset.messageId = message.id;

    div.textContent = message.content;

    messagesContainer.appendChild(div);

    scrollToBottom();
  }

  // ==============================
  // REALTIME
  // ==============================

  function subscribeToMessages() {

    const channel = supabaseClient
      .channel("messages-realtime")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          console.log(
            "Nuevo mensaje recibido:",
            payload.new
          );

          addMessageToScreen(payload.new);
        }
      )

      .subscribe(status => {

        console.log(
          "Estado Realtime:",
          status
        );

      });
  }

  // ==============================
  // ENVIAR MENSAJE
  // ==============================

  async function sendMessage() {

    const content = messageInput.value.trim();

    if (!content || !currentUser) {
      return;
    }

    sendButton.disabled = true;

    const {
      data,
      error
    } = await supabaseClient
      .from("messages")
      .insert({
        sender_id: currentUser.id,
        content: content
      })
      .select()
      .single();

    if (error) {

      console.error(
        "Error enviando mensaje:",
        error
      );

      sendButton.disabled = false;
      return;
    }

    // El mensaje aparecerá también mediante Realtime.
    // No lo añadimos manualmente para evitar duplicados.

    messageInput.value = "";

    sendButton.disabled = false;

    messageInput.focus();
  }

  // ==============================
  // EVENTOS
  // ==============================

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  messageInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );

  // ==============================
  // SCROLL
  // ==============================

  function scrollToBottom() {

    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;
  }

  // ==============================
  // ARRANCAR
  // ==============================

  init();

</script>

</body>
</html>
