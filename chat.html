<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TalkWorld - Chat</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f5;
        color: #111;
    }

    .chat-container {
        max-width: 700px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: white;
    }

    .header {
        padding: 18px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .back-button {
        border: none;
        background: transparent;
        font-size: 25px;
        cursor: pointer;
    }

    .user-info h2 {
        margin: 0;
        font-size: 18px;
    }

    .user-info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 14px;
    }

    #messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .message {
        max-width: 75%;
        padding: 11px 15px;
        border-radius: 17px;
        font-size: 15px;
        line-height: 1.4;
        word-break: break-word;
    }

    .sent {
        align-self: flex-end;
        background: #111;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .received {
        align-self: flex-start;
        background: #eeeeeb;
        color: #111;
        border-bottom-left-radius: 4px;
    }

    .empty {
        text-align: center;
        color: #999;
        margin-top: 50px;
    }

    .input-area {
        border-top: 1px solid #ddd;
        padding: 12px;
        display: flex;
        gap: 10px;
        background: white;
    }

    #message-input {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 22px;
        padding: 12px 16px;
        font-size: 15px;
        outline: none;
    }

    #send-button {
        border: none;
        background: #111;
        color: white;
        padding: 0 20px;
        border-radius: 22px;
        cursor: pointer;
        font-weight: bold;
    }

    #send-button:disabled {
        opacity: 0.5;
    }

    .error {
        padding: 15px 20px;
        background: #fff0f0;
        color: #b00020;
        font-size: 14px;
        line-height: 1.4;
        display: none;
    }

</style>
</head>
<body>
<div class="chat-container">
<!-- HEADER -->

<div class="header">

    <button
        class="back-button"
        id="back-button"
        type="button"
    >
        ←
    </button>


    <div class="user-info">

        <h2 id="partner-name">
            Loading...
        </h2>

        <p id="partner-info">
            TalkWorld
        </p>

    </div>

</div>


<!-- ERROR -->

<div
    class="error"
    id="error-message"
></div>


<!-- MESSAGES -->

<div id="messages">

    <div
        class="empty"
        id="empty-message"
    >
        No messages yet. Start the conversation! 👋
    </div>

</div>


<!-- INPUT -->

<div class="input-area">

    <input
        type="text"
        id="message-input"
        placeholder="Write a message..."
        autocomplete="off"
    >

    <button
        id="send-button"
        type="button"
    >
        Send
    </button>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>


/* =====================================================
   SUPABASE
===================================================== */


const SUPABASE_URL =
    "https://arltyssfvxusgbczehwd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */


const partnerName =
    document.querySelector("#partner-name");


const partnerInfo =
    document.querySelector("#partner-info");


const messagesContainer =
    document.querySelector("#messages");


const messageInput =
    document.querySelector("#message-input");


const sendButton =
    document.querySelector("#send-button");


const errorMessage =
    document.querySelector("#error-message");


const emptyMessage =
    document.querySelector("#empty-message");


/* =====================================================
   VARIABLES
===================================================== */


let currentUser = null;

let partnerId = null;

let realtimeChannel = null;


/* =====================================================
   SHOW ERROR
===================================================== */


function showError(message) {

    console.error(message);

    errorMessage.textContent =
        "Error: " + message;

    errorMessage.style.display =
        "block";
}


/* =====================================================
   GET PARTNER
===================================================== */


function loadPartner() {

    partnerId =
        localStorage.getItem(
            "talkworld_partner_id"
        );


    const username =
        localStorage.getItem(
            "talkworld_partner_username"
        );


    const country =
        localStorage.getItem(
            "talkworld_partner_country"
        );


    const language =
        localStorage.getItem(
            "talkworld_partner_language"
        );


    if (!partnerId) {

        showError(
            "No conversation partner was found."
        );

        setTimeout(function() {

            window.location.href =
                "talk.html";

        }, 2000);

        return false;
    }


    partnerName.textContent =
        username || "TalkWorld user";


    partnerInfo.textContent =
        `${country || "Unknown"} • ${language || "Unknown"}`;


    return true;
}


/* =====================================================
   GET CURRENT USER
===================================================== */


async function loadCurrentUser() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    if (error) {

        showError(
            "Could not verify your login: " +
            error.message
        );

        return false;
    }


    if (!data.user) {

        window.location.href =
            "login.html";

        return false;
    }


    currentUser =
        data.user;


    return true;
}


/* =====================================================
   LOAD MESSAGES
===================================================== */


async function loadMessages() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select(
                "id, sender_id, receiver_id, content, created_at"
            )
            .or(
                `and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        showError(
            "Could not load messages: " +
            error.message
        );

        return;
    }


    messagesContainer.innerHTML = "";


    if (!data || data.length === 0) {

        messagesContainer.appendChild(
            emptyMessage
        );

        return;
    }


    data.forEach(function(message) {

        addMessageToScreen(message);

    });


    scrollToBottom();
}


/* =====================================================
   ADD MESSAGE TO SCREEN
===================================================== */


function addMessageToScreen(message) {

    const messageElement =
        document.createElement("div");


    messageElement.classList.add(
        "message"
    );


    if (
        message.sender_id ===
        currentUser.id
    ) {

        messageElement.classList.add(
            "sent"
        );

    } else {

        messageElement.classList.add(
            "received"
        );

    }


    messageElement.textContent =
        message.content;


    messagesContainer.appendChild(
        messageElement
    );
}


/* =====================================================
   SEND MESSAGE
===================================================== */


async function sendMessage() {

    const content =
        messageInput.value.trim();


    if (!content) {
        return;
    }


    if (!currentUser || !partnerId) {

        showError(
            "The conversation is not ready yet."
        );

        return;
    }


    sendButton.disabled =
        true;


    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .insert({
                sender_id:
                    currentUser.id,

                receiver_id:
                    partnerId,

                content:
                    content
            });


    if (error) {

        showError(
            "Could not send message: " +
            error.message
        );

        sendButton.disabled =
            false;

        return;
    }


    messageInput.value =
        "";

    messageInput.focus();


    sendButton.disabled =
        false;
}


/* =====================================================
   REALTIME
===================================================== */


function startRealtime() {

    realtimeChannel =
        supabaseClient
            .channel(
                "talkworld-chat-" +
                currentUser.id +
                "-" +
                partnerId
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                function(payload) {

                    const message =
                        payload.new;


                    const isOurConversation =
                        (
                            message.sender_id ===
                            currentUser.id &&
                            message.receiver_id ===
                            partnerId
                        )
                        ||
                        (
                            message.sender_id ===
                            partnerId &&
                            message.receiver_id ===
                            currentUser.id
                        );


                    if (!isOurConversation) {
                        return;
                    }


                    if (
                        emptyMessage.parentElement
                    ) {

                        emptyMessage.remove();

                    }


                    /*
                     * Avoid showing our own message twice.
                     * The database insert is already loaded
                     * through realtime.
                     */

                    addMessageToScreen(
                        message
                    );

                    scrollToBottom();

                }
            )
            .subscribe();
}


/* =====================================================
   SCROLL
===================================================== */


function scrollToBottom() {

    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;
}


/* =====================================================
   BACK BUTTON
===================================================== */


document
    .querySelector("#back-button")
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "talk.html";

        }
    );


/* =====================================================
   SEND BUTTON
===================================================== */


sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER KEY
===================================================== */


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   START CHAT
===================================================== */


async function startChat() {

    const partnerLoaded =
        loadPartner();


    if (!partnerLoaded) {
        return;
    }


    const userLoaded =
        await loadCurrentUser();


    if (!userLoaded) {
        return;
    }


    await loadMessages();


    startRealtime();

}


startChat();


</script>
</body>
</html>
