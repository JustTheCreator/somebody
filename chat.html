<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkWorld - Chat</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f5;
        color: #111;
    }

    .chat-container {
        max-width: 700px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: white;
    }

    .header {
        padding: 18px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .back-button {
        border: none;
        background: transparent;
        font-size: 24px;
        cursor: pointer;
    }

    .user-info h2 {
        margin: 0;
        font-size: 18px;
    }

    .user-info p {
        margin: 4px 0 0;
        color: #777;
        font-size: 14px;
    }

    #messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .message {
        max-width: 75%;
        padding: 11px 15px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .sent {
        align-self: flex-end;
        background: #111;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .received {
        align-self: flex-start;
        background: #eeeeeb;
        color: #111;
        border-bottom-left-radius: 4px;
    }

    .empty {
        text-align: center;
        color: #999;
        margin-top: 50px;
    }

    .input-area {
        border-top: 1px solid #ddd;
        padding: 12px;
        display: flex;
        gap: 10px;
        background: white;
    }

    #message-input {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 22px;
        padding: 12px 16px;
        font-size: 15px;
        outline: none;
    }

    #send-button {
        border: none;
        background: #111;
        color: white;
        padding: 0 20px;
        border-radius: 22px;
        cursor: pointer;
        font-weight: bold;
    }

    #send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>
</head>
<body>
<div class="chat-container">
<div class="header">

    <button class="back-button" id="back-button">
        ←
    </button>

    <div class="user-info">
        <h2 id="partner-name">Loading...</h2>
        <p id="partner-info">TalkWorld</p>
    </div>

</div>

<div id="messages">
    <div class="empty" id="empty-message">
        No messages yet. Start the conversation! 👋
    </div>
</div>

<div class="input-area">

    <input
        type="text"
        id="message-input"
        placeholder="Write a message..."
        autocomplete="off"
    >

    <button id="send-button">
        Send
    </button>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const partnerId = localStorage.getItem("talkworld_partner_id");

const partnerUsername =
    localStorage.getItem("talkworld_partner_username");

const partnerCountry =
    localStorage.getItem("talkworld_partner_country");

const partnerLanguage =
    localStorage.getItem("talkworld_partner_language");


const partnerNameElement =
    document.querySelector("#partner-name");

const partnerInfoElement =
    document.querySelector("#partner-info");

const messagesElement =
    document.querySelector("#messages");

const input =
    document.querySelector("#message-input");

const sendButton =
    document.querySelector("#send-button");

const emptyMessage =
    document.querySelector("#empty-message");


let currentUser = null;


async function startChat() {

    if (!partnerId) {

        alert("No conversation partner was found.");

        window.location.href = "talk.html";

        return;
    }


    partnerNameElement.textContent =
        partnerUsername || "TalkWorld user";


    partnerInfoElement.textContent =
        `${partnerCountry || ""} • ${partnerLanguage || ""}`;


    const {
        data: {
            user
        },
        error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        alert("Please log in again.");

        window.location.href = "login.html";

        return;
    }


    currentUser = user;


    await loadMessages();

    subscribeToMessages();
}


async function loadMessages() {

    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${currentUser.id})`
        )
        .order("created_at", {
            ascending: true
        });


    if (error) {

        console.error(error);

        alert("Could not load messages.");

        return;
    }


    messagesElement.innerHTML = "";


    if (!data || data.length === 0) {

        messagesElement.appendChild(emptyMessage);

        return;
    }


    data.forEach(function(message) {

        displayMessage(message);

    });


    scrollToBottom();
}


function displayMessage(message) {

    const div =
        document.createElement("div");


    div.classList.add("message");


    if (message.sender_id === currentUser.id) {

        div.classList.add("sent");

    } else {

        div.classList.add("received");

    }


    div.textContent =
        message.content;


    messagesElement.appendChild(div);
}


async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    sendButton.disabled = true;


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({
            sender_id: currentUser.id,
            receiver_id: partnerId,
            content: text
        });


    if (error) {

        console.error(error);

        alert("Could not send the message.");

        sendButton.disabled = false;

        return;
    }


    input.value = "";

    sendButton.disabled = false;

    input.focus();
}


function subscribeToMessages() {

    supabaseClient
        .channel("talkworld-messages")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                const message =
                    payload.new;


                const belongsToConversation =
                    (
                        message.sender_id === currentUser.id &&
                        message.receiver_id === partnerId
                    )
                    ||
                    (
                        message.sender_id === partnerId &&
                        message.receiver_id === currentUser.id
                    );


                if (!belongsToConversation) {
                    return;
                }


                if (emptyMessage.parentElement) {
                    emptyMessage.remove();
                }


                displayMessage(message);

                scrollToBottom();
            }
        )
        .subscribe();
}


function scrollToBottom() {

    messagesElement.scrollTop =
        messagesElement.scrollHeight;
}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


document.querySelector("#back-button")
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "talk.html";

        }
    );


startChat();

</script>
</body>
</html>
