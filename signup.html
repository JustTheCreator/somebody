<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create your account - TalkWorld</title>

<link rel="stylesheet" href="style.css">

<!-- Supabase -->
<script>
const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);
</script>


<style>
.signup-container {
max-width: 500px;
margin: 80px auto;
padding: 40px 25px;
text-align: center;
}

.signup-container h1 {
margin-bottom: 10px;
}

.signup-container p {
margin-bottom: 30px;
}

.signup-form {
display: flex;
flex-direction: column;
gap: 15px;
}

.signup-form input {
width: 100%;
padding: 15px;
font-size: 16px;
border: 1px solid #ddd;
border-radius: 10px;
box-sizing: border-box;
}

.message {
margin-top: 20px;
font-weight: 500;
}
</style>
</head>

<body>

<header class="navbar">
<div class="logo">TalkWorld</div>

<nav>
<a href="index.html">Home</a>
</nav>
</header>

<main>

<section class="signup-container">

<p class="small-title">JOIN TALKWORLD</p>

<h1>Create your account</h1>

<p>
Create your free TalkWorld account and start talking with people around the world.
</p>

<form class="signup-form" id="signup-form">

<input
type="text"
id="username"
placeholder="Username"
required
>

<input
type="email"
id="email"
placeholder="Email"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
minlength="6"
>

<button
type="submit"
class="primary-button"
id="signup-button"
>
Create account
</button>

</form>

<div
id="message"
class="message"
></div>

</section>

</main>

<footer>
<p>© 2026 TalkWorld</p>
</footer>


<script>

const form = document.querySelector("#signup-form");
const button = document.querySelector("#signup-button");
const message = document.querySelector("#message");

form.addEventListener("submit", async function(event) {

event.preventDefault();

button.disabled = true;
button.textContent = "Creating account...";
message.textContent = "";
message.style.color = "";

const username = document.querySelector("#username").value.trim();
const email = document.querySelector("#email").value.trim();
const password = document.querySelector("#password").value;

try {

if (!window.supabase) {
throw new Error("Supabase library did not load.");
}

if (!window.supabase.createClient) {
throw new Error("Supabase createClient is unavailable.");
}

if (!window.supabaseClient) {
throw new Error("supabaseClient was not created.");
}

const result = await Promise.race([

supabaseClient.auth.signUp({
email: email,
password: password
}),

new Promise(function(_, reject) {
setTimeout(function() {
reject(new Error("Supabase request timed out after 10 seconds."));
}, 10000);
})

]);

const data = result.data;
const error = result.error;

if (error) {
throw error;
}

if (!data || !data.user) {
throw new Error("Account was not created.");
}

const userId = data.user.id;

const profileResult = await supabaseClient
.from("profiles")
.insert([
{
id: userId,
username: username
}
]);

if (profileResult.error) {
throw profileResult.error;
}

message.textContent =
"Account created successfully! Check your email to confirm your account.";

message.style.color = "green";

button.textContent = "Account created";

} catch (error) {

console.error(error);

message.textContent =
"ERROR: " + (error.message || "Unknown error");

message.style.color = "red";

button.disabled = false;
button.textContent = "Create account";
}

});

</script>

</body>
</html>
