<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create account - TalkWorld</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- NAVIGATION -->

<header class="navbar">

    <div class="logo">
        TalkWorld
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>



<!-- SIGN UP -->

<main>

    <section class="about">


        <p class="small-title">
            JOIN TALKWORLD
        </p>


        <h2>
            Create your account
        </h2>


        <p>
            Create an account and start connecting
            with people around the world.
        </p>



        <div style="max-width: 450px; margin: 40px auto; text-align: left;">


            <label for="username">
                Username
            </label>


            <input
                id="username"
                type="text"
                placeholder="Choose a username"
                style="width: 100%; padding: 15px; margin: 8px 0 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"
            >



            <label for="email">
                Email
            </label>


            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                style="width: 100%; padding: 15px; margin: 8px 0 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"
            >



            <label for="password">
                Password
            </label>


            <input
                id="password"
                type="password"
                placeholder="Create a password"
                style="width: 100%; padding: 15px; margin: 8px 0 25px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"
            >



            <button
                id="signup-button"
                class="primary-button"
                type="button"
                style="width: 100%;">

                Create account

            </button>


            <p
                id="message"
                style="margin-top: 20px; text-align: center;">

            </p>


        </div>


    </section>

</main>



<!-- FOOTER -->

<footer>

    <p>
        © 2026 TalkWorld
    </p>

</footer>
</body>
</html>
