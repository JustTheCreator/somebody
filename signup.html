<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - TalkWorld</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #111;
    }

    .container {
        max-width: 450px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 8px;
        font-weight: 600;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 25px;
        border: none;
        border-radius: 12px;
        background: #111;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
    }

    #message {
        margin-top: 20px;
        text-align: center;
        line-height: 1.5;
    }

    .login-link {
        display: block;
        margin-top: 25px;
        text-align: center;
        color: #111;
    }
</style>
</head>
<body>
<div class="container">
<h1>Create your TalkWorld account</h1>

<p class="subtitle">
    Join people from around the world.
</p>

<form id="signup-form">

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Choose a username"
        maxlength="30"
        required
    >


    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Your email"
        required
    >


    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
    >


    <button id="signup-button" type="submit">
        Create account
    </button>

</form>


<div id="message"></div>


<a href="login.html" class="login-link">
    Already have an account? Log in
</a>
</div>
<script>

const SUPABASE_URL =
    "https://arltyssfvxusgbczehwd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const form =
    document.querySelector("#signup-form");

const button =
    document.querySelector("#signup-button");

const message =
    document.querySelector("#message");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document.querySelector("#username")
                .value
                .trim();

        const email =
            document.querySelector("#email")
                .value
                .trim();

        const password =
            document.querySelector("#password")
                .value;


        if (!username) {

            message.textContent =
                "Please choose a username.";

            message.style.color = "red";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating account...";

        message.textContent = "";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            "https://justthecreator.github.io/somebody/",

                        data: {

                            username: username

                        }

                    }

                });


            if (error) {
                throw error;
            }


            message.textContent =
                "Account created! Check your email to confirm your account.";

            message.style.color =
                "green";


            button.textContent =
                "Account created";

        }

        catch (error) {

            console.error(error);

            message.textContent =
                error.message;

            message.style.color =
                "red";


            button.disabled = false;

            button.textContent =
                "Create account";
        }

    }
);

</script>
</body>
</html>
