<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create account - TalkWorld</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

<div class="logo">
TalkWorld
</div>

<nav>
<a href="index.html">
Home
</a>
</nav>

</header>


<main>

<section class="about">

<p class="small-title">
JOIN TALKWORLD
</p>

<h2>
Create your account
</h2>

<p>
Create an account and start connecting
with people around the world.
</p>


<div style="
max-width: 450px;
margin: 40px auto;
text-align: left;
">

<label for="username">
Username
</label>

<input
id="username"
type="text"
placeholder="Choose a username"
style="
width: 100%;
padding: 15px;
margin: 8px 0 20px;
border: 1px solid #ddd;
border-radius: 8px;
font-size: 16px;
">


<label for="email">
Email
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
style="
width: 100%;
padding: 15px;
margin: 8px 0 20px;
border: 1px solid #ddd;
border-radius: 8px;
font-size: 16px;
">


<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Create a password"
style="
width: 100%;
padding: 15px;
margin: 8px 0 25px;
border: 1px solid #ddd;
border-radius: 8px;
font-size: 16px;
">


<button
id="signup-button"
class="primary-button"
type="button"
style="width: 100%;">

Create account

</button>


<p
id="message"
style="
margin-top: 20px;
text-align: center;
word-break: break-word;
">
</p>

</div>

</section>

</main>


<footer>

<p>
© 2026 TalkWorld
</p>

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- CREATE ACCOUNT -->

<script>

const signupButton =
document.querySelector("#signup-button");

const message =
document.querySelector("#message");


signupButton.addEventListener("click", async function () {

const username =
document.querySelector("#username").value.trim();

const email =
document.querySelector("#email").value.trim();

const password =
document.querySelector("#password").value;


if (!username || !email || !password) {

message.textContent =
"Please fill in all fields.";

return;
}


if (password.length < 6) {

message.textContent =
"Password must be at least 6 characters.";

return;
}


signupButton.disabled = true;

signupButton.textContent =
"Creating account...";

message.textContent =
"Connecting to TalkWorld...";


try {

if (!window.supabase) {

throw new Error(
"Supabase library did not load."
);

}


if (!window.supabase.createClient) {

throw new Error(
"Supabase client is unavailable."
);

}


if (!supabaseClient) {

throw new Error(
"Supabase client was not created."
);

}


const result =
await Promise.race([

supabaseClient.auth.signUp({

email: email,

password: password

}),

new Promise(function (resolve) {

setTimeout(function () {

resolve({
timeout: true
});

}, 10000);

})

]);


if (result.timeout) {

throw new Error(
"Supabase connection timed out."
);

}


const data = result.data;

const error = result.error;


if (error) {

throw new Error(
error.message
);

}


if (!data || !data.user) {

throw new Error(
"Supabase did not return a user."
);

}


const profileResult =
await supabaseClient
.from("profiles")
.insert({

id: data.user.id,

username: username

});


if (profileResult.error) {

console.error(
profileResult.error
);

message.textContent =
"Account created, but profile error: " +
profileResult.error.message;

signupButton.disabled = false;

signupButton.textContent =
"Create account";

return;

}


message.textContent =
"Account created successfully! Check your email.";

signupButton.textContent =
"Account created ✓";

signupButton.disabled = true;


} catch (error) {

console.error(error);

message.textContent =
"ERROR: " + error.message;

signupButton.disabled = false;

signupButton.textContent =
"Create account";

}

});

</script>

</body>

</html>
