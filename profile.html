<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Complete your profile - TalkWorld</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

.profile-container {
max-width: 600px;
margin: 60px auto;
padding: 30px 25px;
}

.profile-form {
display: flex;
flex-direction: column;
gap: 20px;
margin-top: 30px;
}

.profile-form label {
font-weight: 600;
margin-bottom: -12px;
}

.profile-form select {
width: 100%;
padding: 15px;
font-size: 16px;
border: 1px solid #ddd;
border-radius: 10px;
background: white;
box-sizing: border-box;
}

.message {
margin-top: 20px;
font-weight: 500;
}

</style>

</head>


<body>


<header class="navbar">

<div class="logo">
TalkWorld
</div>

<nav>

<a href="index.html">
Home
</a>

</nav>

</header>


<main>


<section class="profile-container">


<p class="small-title">
YOUR PROFILE
</p>


<h1>
Tell us a little about yourself
</h1>


<p>
This helps TalkWorld find people you might enjoy talking to.
</p>


<form
class="profile-form"
id="profile-form"
>


<label for="country">
Country
</label>


<select id="country" required>

<option value="">
Select your country
</option>

<option value="Spain">
🇪🇸 Spain
</option>

<option value="France">
🇫🇷 France
</option>

<option value="United Kingdom">
🇬🇧 United Kingdom
</option>

<option value="United States">
🇺🇸 United States
</option>

<option value="Germany">
🇩🇪 Germany
</option>

<option value="Italy">
🇮🇹 Italy
</option>

<option value="Portugal">
🇵🇹 Portugal
</option>

<option value="Brazil">
🇧🇷 Brazil
</option>

<option value="Mexico">
🇲🇽 Mexico
</option>

<option value="Argentina">
🇦🇷 Argentina
</option>

<option value="Japan">
🇯🇵 Japan
</option>

<option value="Other">
🌎 Other
</option>

</select>



<label for="language">
Language you speak
</label>


<select id="language" required>

<option value="">
Select your language
</option>

<option value="Spanish">
🇪🇸 Spanish
</option>

<option value="English">
🇬🇧 English
</option>

<option value="French">
🇫🇷 French
</option>

<option value="German">
🇩🇪 German
</option>

<option value="Italian">
🇮🇹 Italian
</option>

<option value="Portuguese">
🇵🇹 Portuguese
</option>

<option value="Japanese">
🇯🇵 Japanese
</option>

<option value="Chinese">
🇨🇳 Chinese
</option>

<option value="Arabic">
🇸🇦 Arabic
</option>

<option value="Other">
🌎 Other
</option>

</select>



<label for="interest">
What are you interested in?
</label>


<select id="interest" required>

<option value="">
Select an interest
</option>

<option value="Gaming">
🎮 Gaming
</option>

<option value="Travel">
✈️ Travel
</option>

<option value="Music">
🎵 Music
</option>

<option value="Movies">
🎬 Movies
</option>

<option value="Sports">
⚽ Sports
</option>

<option value="Technology">
💻 Technology
</option>

<option value="Just talking">
💬 Just talking
</option>

</select>



<button
type="submit"
class="primary-button"
id="save-button"
>
Save profile
</button>


</form>


<div
id="message"
class="message"
></div>


</section>


</main>


<footer>

<p>
© 2026 TalkWorld
</p>

</footer>



<script>


/* ============================= */
/* SUPABASE */
/* ============================= */


const SUPABASE_URL =
"https://arltyssfvxusgbczehwd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



/* ============================= */
/* ELEMENTS */
/* ============================= */


const form =
document.querySelector("#profile-form");


const saveButton =
document.querySelector("#save-button");


const message =
document.querySelector("#message");



/* ============================= */
/* SAVE PROFILE */
/* ============================= */


form.addEventListener(
"submit",
async function(event) {


event.preventDefault();


saveButton.disabled = true;

saveButton.textContent =
"Saving...";

message.textContent = "";



try {


/* GET USER */

const {
data: {
user
},
error: userError
} =
await supabaseClient
.auth
.getUser();



if (userError || !user) {

window.location.href =
"login.html";

return;

}



/* GET VALUES */

const country =
document
.querySelector("#country")
.value;


const language =
document
.querySelector("#language")
.value;


const interest =
document
.querySelector("#interest")
.value;



/* UPDATE PROFILE */

const {
error
} =
await supabaseClient
.from("profiles")
.update({

country: country,

language: language,

interest: interest

})
.eq(
"id",
user.id
);



if (error) {

throw error;

}



/* SUCCESS */

message.textContent =
"Profile saved successfully!";

message.style.color =
"green";


saveButton.textContent =
"Saved!";



setTimeout(
function() {

window.location.href =
"account.html";

},
1000
);


}


catch (error) {


console.error(error);


message.textContent =
"ERROR: " +
error.message;

message.style.color =
"red";


saveButton.disabled =
false;

saveButton.textContent =
"Save profile";


}


}
);


</script>


</body>

</html>
