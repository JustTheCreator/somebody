<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talk to someone - TalkWorld</title>

<link rel="stylesheet" href="style.css">

<style>

    /* SELECTED OPTION */

    .option-button.selected {

        background: #111111;

        color: white;

        border-color: #111111;

        transform: scale(1.03);

    }


    .option-button {

        transition: all 0.2s ease;

    }


    .option-button:hover {

        transform: translateY(-2px);

    }

</style>
</head>
<body>
<!-- NAVIGATION -->

<header class="navbar">

    <div class="logo">

        TalkWorld

    </div>


    <nav>

        <a href="index.html">

            Home

        </a>

    </nav>

</header>



<!-- MAIN CONTENT -->

<main>

    <section class="about">


        <p class="small-title">

            FIND SOMEONE

        </p>


        <h2>

            Who would you like to talk to?

        </h2>



        <!-- LANGUAGE OPTIONS -->

        <div class="buttons">


            <button

                class="secondary-button option-button"

                data-type="language"

                data-value="anyone"

                type="button">

                🌎 Anyone

            </button>



            <button

                class="secondary-button option-button"

                data-type="language"

                data-value="spanish"

                type="button">

                🇪🇸 Spanish

            </button>



            <button

                class="secondary-button option-button"

                data-type="language"

                data-value="english"

                type="button">

                🇬🇧 English

            </button>



            <button

                class="secondary-button option-button"

                data-type="language"

                data-value="french"

                type="button">

                🇫🇷 French

            </button>



            <button

                class="secondary-button option-button"

                data-type="language"

                data-value="german"

                type="button">

                🇩🇪 German

            </button>


        </div>



        <br>

        <br>



        <!-- INTERESTS -->

        <h2>

            What are you interested in?

        </h2>



        <div class="buttons">


            <button

                class="secondary-button option-button"

                data-type="interest"

                data-value="gaming"

                type="button">

                🎮 Gaming

            </button>



            <button

                class="secondary-button option-button"

                data-type="interest"

                data-value="travel"

                type="button">

                ✈️ Travel

            </button>



            <button

                class="secondary-button option-button"

                data-type="interest"

                data-value="music"

                type="button">

                🎵 Music

            </button>



            <button

                class="secondary-button option-button"

                data-type="interest"

                data-value="movies"

                type="button">

                🎬 Movies

            </button>



            <button

                class="secondary-button option-button"

                data-type="interest"

                data-value="just-talking"

                type="button">

                💬 Just talking

            </button>


        </div>



        <br>

        <br>



        <!-- FIND BUTTON -->

        <button

            class="primary-button"

            id="find-button"

            type="button">

            Find someone

        </button>


    </section>

</main>



<!-- FOOTER -->

<footer>

    <p>

        © 2026 TalkWorld

    </p>

</footer>



<!-- TALKWORLD JAVASCRIPT -->

<script>

    let selectedLanguage = null;

    let selectedInterest = null;


    const optionButtons = document.querySelectorAll(".option-button");

    const findButton = document.querySelector("#find-button");



    optionButtons.forEach(function(button) {


        button.addEventListener("click", function() {


            const type = button.dataset.type;

            const value = button.dataset.value;



            if (type === "language") {


                selectedLanguage = value;


                document
                    .querySelectorAll('[data-type="language"]')
                    .forEach(function(languageButton) {

                        languageButton.classList.remove("selected");

                    });


                button.classList.add("selected");


            }



            if (type === "interest") {


                selectedInterest = value;


                document
                    .querySelectorAll('[data-type="interest"]')
                    .forEach(function(interestButton) {

                        interestButton.classList.remove("selected");

                    });


                button.classList.add("selected");


            }


        });


    });



    findButton.addEventListener("click", function() {


        if (!selectedLanguage) {

            alert("Please choose a language first.");

            return;

        }


        if (!selectedInterest) {

            alert("Please choose an interest first.");

            return;

        }


        alert(

            "Searching for someone...\n\n" +

            "Language: " + selectedLanguage +

            "\nInterest: " + selectedInterest

        );


    });

</script>
</body>
</html>
