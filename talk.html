<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkWorld - Find someone</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f5;
        color: #111;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 30px 20px;
    }

    .back {
        display: inline-block;
        margin-bottom: 25px;
        color: #111;
        text-decoration: none;
        font-size: 15px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 34px;
    }

    .description {
        color: #666;
        line-height: 1.5;
        margin-bottom: 30px;
    }

    .card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 20px;
    }

    .card h2 {
        margin-top: 0;
        font-size: 20px;
    }

    .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .option {
        border: 1px solid #ccc;
        background: white;
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        font-size: 15px;
        text-align: center;
    }

    .option:hover {
        border-color: #111;
    }

    .option.selected {
        background: #111;
        color: white;
        border-color: #111;
    }

    #find-button {
        width: 100%;
        margin-top: 25px;
        border: none;
        background: #111;
        color: white;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #find-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #status {
        margin-top: 20px;
        text-align: center;
        line-height: 1.5;
    }

    .result {
        display: none;
        margin-top: 25px;
        padding: 22px;
        border: 1px solid #ddd;
        border-radius: 18px;
        background: #fafafa;
    }

    .result h2 {
        margin: 0 0 10px;
    }

    .result p {
        margin: 7px 0;
        color: #555;
    }

    #start-button {
        width: 100%;
        margin-top: 18px;
        border: none;
        background: #111;
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .error {
        color: #c62828;
    }

    .success {
        color: #16803c;
    }

    .loading {
        color: #666;
    }

    @media (max-width: 500px) {
        .options {
            grid-template-columns: 1fr;
        }

        h1 {
            font-size: 29px;
        }
    }
</style>
</head>
<body>
<div class="container">
<a href="account.html" class="back">
    ← Back to account
</a>

<h1>Find someone to talk to</h1>

<p class="description">
    Choose the language and interest you want to connect through.
    We'll look for another TalkWorld user who matches your choices.
</p>


<!-- LANGUAGE -->

<div class="card">

    <h2>Choose a language</h2>

    <div class="options" id="language-options">

        <button class="option" data-language="Spanish">
            🇪🇸 Spanish
        </button>

        <button class="option" data-language="English">
            🇬🇧 English
        </button>

        <button class="option" data-language="French">
            🇫🇷 French
        </button>

        <button class="option" data-language="German">
            🇩🇪 German
        </button>

        <button class="option" data-language="Italian">
            🇮🇹 Italian
        </button>

        <button class="option" data-language="Portuguese">
            🇵🇹 Portuguese
        </button>

        <button class="option" data-language="Japanese">
            🇯🇵 Japanese
        </button>

        <button class="option" data-language="Other">
            🌎 Other
        </button>

    </div>

</div>


<!-- INTEREST -->

<div class="card">

    <h2>Choose an interest</h2>

    <div class="options" id="interest-options">

        <button class="option" data-interest="Music">
            🎵 Music
        </button>

        <button class="option" data-interest="Travel">
            ✈️ Travel
        </button>

        <button class="option" data-interest="Gaming">
            🎮 Gaming
        </button>

        <button class="option" data-interest="Anime">
            🎌 Anime
        </button>

        <button class="option" data-interest="Sports">
            ⚽ Sports
        </button>

        <button class="option" data-interest="Movies">
            🎬 Movies
        </button>

        <button class="option" data-interest="Technology">
            💻 Technology
        </button>

        <button class="option" data-interest="Life">
            🌱 Life
        </button>

    </div>


    <button id="find-button">
        Find someone
    </button>

    <div id="status"></div>


    <!-- MATCH RESULT -->

    <div class="result" id="result">

        <h2 id="partner-name">
            User
        </h2>

        <p>
            🌎 Country:
            <span id="partner-country"></span>
        </p>

        <p>
            🗣️ Language:
            <span id="partner-language"></span>
        </p>

        <p>
            ❤️ Interest:
            <span id="partner-interest"></span>
        </p>

        <button id="start-button">
            Start conversation
        </button>

    </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL = "https://arltyssfvxusgbczehwd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6shqoWqM68h4HWe5FDae_Q_LBYXMPI5";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ================================
   VARIABLES
================================ */

let currentUser = null;

let selectedLanguage = null;

let selectedInterest = null;

let matchedUser = null;


/* ================================
   ELEMENTS
================================ */

const languageButtons =
    document.querySelectorAll(
        "#language-options .option"
    );

const interestButtons =
    document.querySelectorAll(
        "#interest-options .option"
    );

const findButton =
    document.querySelector("#find-button");

const status =
    document.querySelector("#status");

const result =
    document.querySelector("#result");

const startButton =
    document.querySelector("#start-button");


/* ================================
   CHECK LOGIN
================================ */

async function checkUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();


    if (error || !data.user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = data.user;
}


/* ================================
   LANGUAGE SELECTION
================================ */

languageButtons.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            languageButtons.forEach(
                function(item) {
                    item.classList.remove("selected");
                }
            );


            button.classList.add("selected");


            selectedLanguage =
                button.dataset.language;

        }
    );

});


/* ================================
   INTEREST SELECTION
================================ */

interestButtons.forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            interestButtons.forEach(
                function(item) {
                    item.classList.remove("selected");
                }
            );


            button.classList.add("selected");


            selectedInterest =
                button.dataset.interest;

        }
    );

});


/* ================================
   FIND USER
================================ */

findButton.addEventListener(
    "click",
    async function() {

        result.style.display = "none";


        if (!selectedLanguage) {

            status.textContent =
                "Please choose a language.";

            status.className =
                "error";

            return;
        }


        if (!selectedInterest) {

            status.textContent =
                "Please choose an interest.";

            status.className =
                "error";

            return;
        }


        findButton.disabled = true;


        status.textContent =
            "Looking for someone...";

        status.className =
            "loading";


        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, country, language, interest"
            )
            .eq(
                "language",
                selectedLanguage
            )
            .eq(
                "interest",
                selectedInterest
            )
            .neq(
                "id",
                currentUser.id
            )
            .limit(1);


        findButton.disabled = false;


        if (error) {

            console.error(error);

            status.textContent =
                "Something went wrong while searching.";

            status.className =
                "error";

            return;
        }


        if (!data || data.length === 0) {

            status.textContent =
                "We couldn't find anyone yet. Try another language or interest.";

            status.className =
                "error";

            return;
        }


        /* ================================
           MATCH FOUND
        ================================ */

        matchedUser =
            data[0];


        document.querySelector(
            "#partner-name"
        ).textContent =
            matchedUser.username ||
            "TalkWorld user";


        document.querySelector(
            "#partner-country"
        ).textContent =
            matchedUser.country ||
            "Not specified";


        document.querySelector(
            "#partner-language"
        ).textContent =
            matchedUser.language ||
            "Not specified";


        document.querySelector(
            "#partner-interest"
        ).textContent =
            matchedUser.interest ||
            "Not specified";


        result.style.display =
            "block";


        status.textContent =
            "Someone was found! 🎉";

        status.className =
            "success";

    }
);


/* ================================
   START CONVERSATION
================================ */

startButton.addEventListener(
    "click",
    function() {

        if (!matchedUser) {

            return;
        }


        /*
         * Save the person we matched with.
         * chat.html will use these values.
         */

        localStorage.setItem(
            "talkworld_partner_id",
            matchedUser.id
        );


        localStorage.setItem(
            "talkworld_partner_username",
            matchedUser.username ||
            "TalkWorld user"
        );


        localStorage.setItem(
            "talkworld_partner_country",
            matchedUser.country ||
            "Unknown"
        );


        localStorage.setItem(
            "talkworld_partner_language",
            matchedUser.language ||
            "Unknown"
        );


        localStorage.setItem(
            "talkworld_partner_interest",
            matchedUser.interest ||
            "Unknown"
        );


        window.location.href =
            "chat.html";

    }
);


/* ================================
   START
================================ */

checkUser();

</script>
</body>
</html>
