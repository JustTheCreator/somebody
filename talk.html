<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talk to someone - TalkWorld</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- NAVIGATION -->

<header class="navbar">

    <div class="logo">
        TalkWorld
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>



<!-- MAIN CONTENT -->

<main>

    <section class="about">


        <p class="small-title">
            FIND SOMEONE
        </p>


        <h2>
            Who would you like to talk to?
        </h2>


        <!-- LANGUAGE OPTIONS -->

        <div class="buttons">


            <button
                class="secondary-button option-button"
                data-type="language"
                data-value="anyone"
                type="button">

                🌎 Anyone

            </button>


            <button
                class="secondary-button option-button"
                data-type="language"
                data-value="spanish"
                type="button">

                🇪🇸 Spanish

            </button>


            <button
                class="secondary-button option-button"
                data-type="language"
                data-value="english"
                type="button">

                🇬🇧 English

            </button>


            <button
                class="secondary-button option-button"
                data-type="language"
                data-value="french"
                type="button">

                🇫🇷 French

            </button>


            <button
                class="secondary-button option-button"
                data-type="language"
                data-value="german"
                type="button">

                🇩🇪 German

            </button>


        </div>



        <br>
        <br>



        <!-- INTERESTS -->

        <h2>
            What are you interested in?
        </h2>


        <div class="buttons">


            <button
                class="secondary-button option-button"
                data-type="interest"
                data-value="gaming"
                type="button">

                🎮 Gaming

            </button>


            <button
                class="secondary-button option-button"
                data-type="interest"
                data-value="travel"
                type="button">

                ✈️ Travel

            </button>


            <button
                class="secondary-button option-button"
                data-type="interest"
                data-value="music"
                type="button">

                🎵 Music

            </button>


            <button
                class="secondary-button option-button"
                data-type="interest"
                data-value="movies"
                type="button">

                🎬 Movies

            </button>


            <button
                class="secondary-button option-button"
                data-type="interest"
                data-value="just-talking"
                type="button">

                💬 Just talking

            </button>


        </div>



        <br>
        <br>



        <!-- FIND BUTTON -->

        <button
            class="primary-button"
            id="find-button"
            type="button">

            Find someone

        </button>


    </section>

</main>



<!-- FOOTER -->

<footer>

    <p>
        © 2026 TalkWorld
    </p>

</footer>


<!-- JAVASCRIPT -->

<script src="./talk.js"></script>
</body>
</html>
